<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Searchbox 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="wrap">
    <h1>Searchbox 设置</h1>

    <section class="block">
      <h2>通用</h2>
      <label class="row switch">
        <input type="checkbox" id="newtab-toggle">
        <span>
          <strong>接管新标签页</strong>
          <em>开启后 Ctrl+T 直接打开搜索页。关闭后新标签页恢复浏览器默认，仍可点工具栏图标或按 Alt+S 打开</em>
        </span>
      </label>

      <label class="field limit-field">
        <span>每个来源取多少条<em>1–50；条数越多首屏越慢</em></span>
        <div class="inline">
          <input id="limit-input" type="number" min="1" max="50" step="1">
          <span id="limit-hint" class="inline-hint"></span>
        </div>
      </label>
    </section>

    <section class="block">
      <h2>AI 总结</h2>
      <p class="tip">填好接口地址和模型名后，搜索时会在结果上方自动生成总结。留空则不启用，不会发起任何请求。</p>

      <label class="field">
        <span>接口地址<em>OpenAI 兼容的 chat/completions</em></span>
        <input id="ai-url" type="text" spellcheck="false" autocomplete="off" placeholder="https://open.bigmodel.cn/api/paas/v4/chat/completions">
      </label>

      <label class="field">
        <span>模型名</span>
        <input id="ai-model" type="text" spellcheck="false" autocomplete="off" placeholder="glm-4.7-flash">
      </label>

      <label class="field">
        <span>API Key<em>本地模型（如 Ollama）可留空</em></span>
        <input id="ai-key" type="password" spellcheck="false" autocomplete="off" placeholder="留空则不发送 Authorization">
      </label>

      <label class="field">
        <span>提示词<em>系统提示，留空用默认</em></span>
        <textarea id="ai-prompt" rows="3" spellcheck="false" placeholder="留空则使用默认提示词"></textarea>
      </label>

      <label class="field limit-field">
        <span>送给模型的结果条数<em>1–30，越多越慢也越贵</em></span>
        <input id="ai-detail" type="number" min="1" max="30" step="1" value="10">
      </label>

      <div class="head-actions">
        <button id="ai-test" class="btn ghost" type="button">测试</button>
        <button id="ai-save" class="btn primary" type="button">保存</button>
      </div>
      <p id="ai-status" class="status" hidden></p>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>搜索源</h2>
        <button id="btn-new" class="btn ghost" type="button">＋ 新增源</button>
      </div>
      <ul id="source-list" class="sources"></ul>
      <p class="tip">内置源可以修改和禁用，改动可随时「恢复内置」。新增源需要为此授权访问它的接口地址。</p>
    </section>

    <section class="block" id="editor-block" hidden>
      <div class="block-head">
        <h2 id="editor-title">编辑</h2>
        <div class="head-actions">
          <button id="btn-delete" class="btn ghost danger" type="button" hidden>删除</button>
          <button id="btn-reset" class="btn ghost" type="button" hidden>恢复内置</button>
          <button id="btn-save" class="btn primary" type="button">保存</button>
        </div>
      </div>

      <label class="field">
        <span>API Key<em id="key-hint"></em></span>
        <div class="inline">
          <input id="key-input" type="password" spellcheck="false" autocomplete="off" placeholder="留空则不发送 Authorization">
          <button id="btn-reveal" class="btn ghost" type="button">显示</button>
        </div>
      </label>

      <label class="field">
        <span>配置 JSON<em>占位符：{{query}} {{key}} {{limit}}</em></span>
        <textarea id="editor" spellcheck="false" rows="20"></textarea>
      </label>

      <p id="save-status" class="status" hidden></p>
    </section>

    <section class="block" id="test-block" hidden>
      <div class="block-head">
        <h2>测试</h2>
        <div class="head-actions">
          <input id="test-query" type="text" value="electron" spellcheck="false" aria-label="测试查询词">
          <button id="btn-test" class="btn primary" type="button">跑一次</button>
        </div>
      </div>
      <p id="test-status" class="status" hidden></p>
      <div class="panes">
        <div class="pane">
          <h3>原始响应</h3>
          <pre id="test-raw" class="code">（还没跑）</pre>
        </div>
        <div class="pane">
          <h3>解析结果</h3>
          <ol id="test-parsed" class="parsed"></ol>
        </div>
      </div>
    </section>

    <p class="tip footer">
      开发用：<a href="tests.html" target="_blank" rel="noopener">纯函数自检页</a> —— 改过解析或合并逻辑后跑一遍，应全绿。
    </p>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
